<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكسب — منصة المهام</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#182230}
header{background:#111827;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}.tag{opacity:.8;font-size:13px}
main{max-width:1050px;margin:30px auto;padding:0 18px}.hero{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0000000d}
h1{margin:0 0 10px}.hero p{color:#667085}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0000000a}.balance{font-size:28px;font-weight:800;color:#159447}
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.task{border:1px solid #e5e7eb;border-radius:14px;padding:18px}.task h3{margin:0 0 8px}.task p{color:#667085}
button{border:0;border-radius:10px;padding:11px 17px;background:#16a34a;color:white;font-weight:700;cursor:pointer}button:disabled{background:#9ca3af}
section{margin-top:22px}.withdraw{display:flex;gap:10px;flex-wrap:wrap}.withdraw input{padding:11px;border:1px solid #d1d5db;border-radius:10px;max-width:180px}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:13px;border-radius:12px;margin-top:18px;color:#9a3412}
@media(max-width:700px){.cards,.tasks{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">مكسب</div><div class="tag">نسخة تجريبية</div></header>
<main>
<div class="hero">
<h1>اكسب من إنجاز المهام</h1>
<p>نسخة أولية لمنصة مهام. الرصيد هنا تجريبي إلى أن يتم ربط الموقع بنظام دفع حقيقي.</p>
</div>

<div class="cards">
<div class="card"><div>الرصيد</div><div class="balance" id="balance">0.00 د.ل</div></div>
<div class="card"><div>المهام المكتملة</div><div class="balance" id="done">0</div></div>
<div class="card"><div>الحالة</div><div>حساب تجريبي</div></div>
</div>

<section>
<h2>المهام المتاحة</h2>
<div class="tasks" id="tasks"></div>
</section>

<section class="card">
<h2>طلب سحب</h2>
<div class="withdraw">
<select id="method">
<option>تحويل مصرفي</option><option>محفظة إلكترونية</option>
</select>
<input id="amount" type="number" min="1" placeholder="المبلغ بالدينار">
<button onclick="withdraw()">طلب السحب</button>
</div>
<div id="msg" class="notice" style="display:none"></div>
</section>
</main>

<script>
let balance=0, done=0;
const tasks=[
 {id:1,title:"مهمة تجريبية",desc:"اقرأ وصف المهمة ثم أكد إتمامها.",reward:0.50},
 {id:2,title:"استبيان قصير",desc:"أكمل استبيانًا تجريبيًا.",reward:1.00},
 {id:3,title:"اختبار موقع",desc:"جرّب صفحة تجريبية وأرسل ملاحظتك.",reward:1.50},
 {id:4,title:"مهمة محتوى",desc:"اكتب رأيًا قصيرًا حول خدمة.",reward:2.00}
];
function render(){
 document.getElementById("balance").textContent=balance.toFixed(2)+" د.ل";
 document.getElementById("done").textContent=done;
 document.getElementById("tasks").innerHTML=tasks.map(t=>`
 <div class="task"><h3>${t.title}</h3><p>${t.desc}</p>
 <strong>${t.reward.toFixed(2)} د.ل</strong><br><br>
 <button onclick="complete(${t.id},this)">إكمال المهمة</button></div>`).join("");
}
function complete(id,btn){
 const t=tasks.find(x=>x.id===id); if(btn.disabled)return;
 balance+=t.reward; done++; btn.disabled=true; btn.textContent="تم الإكمال";
 render();
}
function withdraw(){
 const amount=Number(document.getElementById("amount").value), msg=document.getElementById("msg");
 msg.style.display="block";
 if(!amount || amount<=0){msg.textContent="أدخل مبلغًا صحيحًا.";return}
 if(amount>balance){msg.textContent="الرصيد غير كافٍ.";return}
 msg.textContent="تم تسجيل طلب السحب تجريبيًا. لا يوجد دفع حقيقي في هذه النسخة.";
}
render();
</script>
</body></html>
