<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكسب — البداية الحقيقية</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;margin:0;color:#172033}
header{background:#111827;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}
main{max-width:1000px;margin:30px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 6px 25px #0001}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;box-sizing:border-box}
button{background:#16a34a;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
button.alt{background:#e5e7eb;color:#111827}
.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.service{border:1px solid #e5e7eb;border-radius:14px;padding:16px}.price{font-weight:800;font-size:21px}
.msg{padding:10px;border-radius:10px;background:#fff7ed;margin-top:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>مكسب</strong><span id="userState">غير مسجل</span></header>
<main>
<section class="card" id="authBox">
<h2>إنشاء حساب / تسجيل الدخول</h2>
<input id="name" placeholder="الاسم (عند التسجيل)">
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<div>
<button onclick="signUp()">إنشاء حساب</button>
<button class="alt" onclick="signIn()">دخول</button>
</div>
<button class="alt" onclick="forgotPassword()" style="margin-top:8px">نسيت كلمة المرور؟</button>
<div id="authMsg" class="msg hidden"></div>
</section>

<section class="card hidden" id="appBox">
<h2>حسابك</h2>
<p id="profileLine"></p>
<button class="alt" onclick="signOut()">تسجيل الخروج</button>
</section>

<section class="card">
<h2>الخدمات</h2>
<div id="services" class="grid"><p>جارٍ التحميل...</p></div>
</section>

<section class="card hidden" id="addBox">
<h2>أضف خدمة</h2>
<input id="svcTitle" placeholder="اسم الخدمة">
<select id="svcCat">
<option value="">اختر القسم</option><option>تصميم</option><option>مونتاج</option><option>كتابة</option><option>ترجمة</option><option>خدمات أخرى</option>
</select>
<input id="svcPrice" type="number" min="1" step="0.1" placeholder="السعر بالدينار الليبي">
<textarea id="svcDesc" placeholder="وصف الخدمة"></textarea>
<button onclick="addService()">نشر الخدمة</button>
<div id="svcMsg" class="msg hidden"></div>
</section>

<section class="card hidden" id="ordersBox">
<h2>طلباتي</h2>
<div id="orders"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

async function refresh(){
  const {data:{user}} = await sb.auth.getUser();
  currentUser=user||null;
  document.getElementById('userState').textContent = currentUser ? (currentUser.email||'مسجل') : 'غير مسجل';
  document.getElementById('authBox').classList.toggle('hidden',!!currentUser);
  document.getElementById('appBox').classList.toggle('hidden',!currentUser);
  document.getElementById('addBox').classList.toggle('hidden',!currentUser);
  document.getElementById('ordersBox').classList.toggle('hidden',!currentUser);
  if(currentUser){
    const {data:p}=await sb.from('profiles').select('full_name').eq('id',currentUser.id).maybeSingle();
    document.getElementById('profileLine').textContent='مرحبًا '+(p?.full_name||currentUser.email);
    loadOrders();
  }
  loadServices();
}
function show(id,msg){const e=document.getElementById(id);e.textContent=msg;e.classList.remove('hidden')}
async function signUp(){
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value, name=document.getElementById('name').value.trim();
  if(!email||!password||!name)return show('authMsg','املأ الاسم والبريد وكلمة المرور.');
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});
  if(error)return show('authMsg',error.message);
  show('authMsg','تم إنشاء الحساب. قد تحتاج لتأكيد بريدك الإلكتروني قبل تسجيل الدخول.');
}
async function signIn(){
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)return show('authMsg',error.message); refresh();
}
async function forgotPassword(){
  const email=document.getElementById('email').value.trim();
  if(!email)return show('authMsg','اكتب بريدك الإلكتروني أولًا ثم اضغط «نسيت كلمة المرور؟».');
  const redirect=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});
  if(error)return show('authMsg',error.message);
  show('authMsg','تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.');
}
async function signOut(){await sb.auth.signOut();refresh()}
async function loadServices(){
  const box=document.getElementById('services');
  const {data,error}=await sb.from('services').select('id,title,category,description,price,profiles(full_name)').eq('status','active').order('created_at',{ascending:false});
  if(error){box.innerHTML='<p>تعذر تحميل الخدمات. تأكد من إعداد قاعدة البيانات.</p>';return}
  box.innerHTML=data.length?data.map(s=>`<div class="service"><b>${esc(s.category)}</b><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><small>المقدم: ${esc(s.profiles?.full_name||'مستخدم')}</small><p class="price">${Number(s.price).toFixed(1)} د.ل</p>${currentUser?`<button onclick="orderService('${s.id}')">طلب الخدمة</button>`:'<small>سجل الدخول لطلب الخدمة</small>'}</div>`).join(''):'<p>لا توجد خدمات بعد.</p>';
}
async function addService(){
  if(!currentUser)return;
  const title=document.getElementById('svcTitle').value.trim(),category=document.getElementById('svcCat').value,price=Number(document.getElementById('svcPrice').value),description=document.getElementById('svcDesc').value.trim();
  if(!title||!category||!price||!description)return show('svcMsg','أكمل بيانات الخدمة.');
  const {error}=await sb.from('services').insert({seller_id:currentUser.id,title,category,price,description});
  if(error)return show('svcMsg',error.message);
  show('svcMsg','تم نشر الخدمة.'); document.getElementById('svcTitle').value='';document.getElementById('svcDesc').value='';loadServices();
}
async function orderService(serviceId){
  const {error}=await sb.rpc('create_order',{p_service_id:serviceId});
  if(error)return alert(error.message);
  alert('تم إنشاء الطلب.');loadOrders();
}
async function loadOrders(){
  const box=document.getElementById('orders');
  const {data,error}=await sb.from('orders').select('id,price,status,created_at,services(title),seller_id').eq('buyer_id',currentUser.id).order('created_at',{ascending:false});
  if(error){box.textContent='تعذر تحميل الطلبات.';return}
  box.innerHTML=data.length?data.map(o=>`<p><b>${esc(o.services?.title)}</b> — ${Number(o.price).toFixed(1)} د.ل — ${esc(o.status)}</p>`).join(''):'لا توجد طلبات بعد.';
}
sb.auth.onAuthStateChange(async (event)=>{
  if(event === 'PASSWORD_RECOVERY'){
    const app=document.getElementById('authBox');
    app.classList.remove('hidden');
    app.innerHTML = `
      <h2>إعادة تعيين كلمة المرور</h2>
      <input id="newPassword" type="password" placeholder="كلمة المرور الجديدة">
      <input id="confirmPassword" type="password" placeholder="أعد كتابة كلمة المرور">
      <button onclick="updatePassword()">حفظ كلمة المرور الجديدة</button>
      <div id="authMsg" class="msg hidden"></div>
    `;
  }
  refresh();
});
async function updatePassword(){
  const p=document.getElementById('newPassword').value;
  const c=document.getElementById('confirmPassword').value;
  if(!p || p.length < 6)return show('authMsg','كلمة المرور يجب أن تكون 6 أحرف أو أكثر.');
  if(p!==c)return show('authMsg','كلمتا المرور غير متطابقتين.');
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return show('authMsg',error.message);
  show('authMsg','تم تغيير كلمة المرور بنجاح.');
}
refresh();
</script>
</body>
</html>
